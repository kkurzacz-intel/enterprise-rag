---
name: "Sec :: Renovate"

# Self-hosted Renovate (no Mend app). Config: renovate.json in the repo root.
# All updates wait for approval on the Dependency Dashboard issue; ticking a
# checkbox there re-runs this workflow, which then creates that branch/PR.

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  issues:
    types: [edited]

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    # On issue edits, run only for the dashboard and only when a box is ticked.
    # Renovate's own rewrite of the dashboard leaves every box unticked, so it
    # does not retrigger this workflow.
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.title == 'Renovate: out-of-range dependency updates' &&
       contains(github.event.issue.body, '- [x] <!--'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Run Renovate
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        with:
          # Fine-grained PAT, this repository only. Repository permissions:
          # Contents, Pull requests, Issues: read and write; Metadata: read.
          token: ${{ secrets.RENOVATE_TOKEN }}
          renovate-version: "44.244.2"
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          LOG_LEVEL: info
