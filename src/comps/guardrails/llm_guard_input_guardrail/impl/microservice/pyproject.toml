[project]
name = "Intel-Enterprise-RAG-LLM_Guard_Input_Guardrail_Microservice"
version = "3.0.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "pip>=26.2,<27",
    "docarray[proto,image]>=0.40.0,<1",
    "fastapi>=0.136.3,<1",
    "opentelemetry-api>=1.39.1,<2",
    "opentelemetry-exporter-otlp>=1.39.1,<2",
    "opentelemetry-sdk>=1.39.1,<2",
    "prometheus-fastapi-instrumentator>=8.0.0,<9",
    "shortuuid>=1.0.13,<2",
    "uvicorn>=0.30.1,<1",
    "python-dotenv>=1.2.2,<2",
    "h11>=0.16.0,<1",
    "setuptools>=80.10.2,<81",     # security update
    "requests>=2.33.1,<3",
    "urllib3>=2.8.0,<3",
    "cryptography>=50.0.0,<51",
    "aiohttp>=3.14.3,<4",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.3.0,<2",
    "pytest-cov>=5.0.0,<6",
    "fastapi>=0.136.3,<1",
    "docarray[proto,image]>=0.40.0,<1",
    "opentelemetry-api>=1.39.1,<2",
    "opentelemetry-exporter-otlp>=1.39.1,<2",
    "opentelemetry-sdk>=1.39.1,<2",
]

[dependency-groups]
security-overrides = [
  "protobuf>=6.33.5,<7",
]

llm-guard = [
  "bc-detect-secrets>=1.5.47,<2",
  "faker>=40.36.0,<41",
  "nltk>=3.9.4,<4",
  "presidio-analyzer>=2.2.364,<3",
  "presidio-anonymizer>=2.2.364,<3",
  "structlog>=26.1.0,<27",
  "tiktoken>=0.13.0,<1",
  # Pinned rather than floored: the transformers/torch versions affect scanner
  # inference results.
  "torch>=2.13.0,<3",
  "transformers==5.22.2",
]

[tool.uv]
# presidio-anonymizer 2.2.364 (latest) caps cryptography <49, which leaves
# CVE-2026-69249 and CVE-2026-69247 unfixed. Only TextReplaceBuilder is used from
# presidio-anonymizer, not its cryptography-based operators. Drop this override
# once presidio-anonymizer allows cryptography>=50.
override-dependencies = [
  "cryptography>=50.0.0,<51",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
