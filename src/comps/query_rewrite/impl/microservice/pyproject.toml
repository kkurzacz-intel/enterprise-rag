[project]
name = "Intel_Enterprise_RAG-QueryRewrite_Microservice"
version = "3.0.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "aiohttp>=3.14.3,<4",
    "docarray[proto,image]>=0.40.0,<1",
    "fastapi>=0.136.3,<1",
    "h11>=0.16.0,<1",
    "httpx>=0.27.0,<1",
    "jinja2>=3.1.6,<4",
    "openai>=3.31.0,<4",
    "opentelemetry-api>=1.40.0,<2",
    "opentelemetry-exporter-otlp>=1.40.0,<2",
    "prometheus-fastapi-instrumentator>=8.0.0,<9",
    "python-dotenv>=1.2.2,<2",
    "pyyaml>=6.0,<7",
    "requests>=2.32.0,<3",
    "setuptools>=80.10.2,<81",
    "shortuuid>=1.0.13,<2",
    "urllib3>=2.8.0,<3",
    "uvicorn>=0.30.1,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.3.0,<2",
    "pytest-cov>=5.0.0,<6",
]
