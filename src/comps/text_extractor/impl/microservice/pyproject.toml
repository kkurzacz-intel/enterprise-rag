[project]
name = "Intel-Enterprise-RAG-Text_Extractor_Microservice"
version = "3.0.0"
requires-python = ">=3.11.5,<3.12"

dependencies = [
    "fastapi>=0.136.3,<1",
    "opentelemetry-api>=1.39.1,<2",
    "opentelemetry-exporter-otlp>=1.39.1,<2",
    "opentelemetry-sdk>=1.39.1,<2",
    "prometheus-fastapi-instrumentator>=8.0.0,<9",
    "numpy>=2.1.0,<3",
    "docarray[proto,image]>=0.40.0,<1",
    "uvicorn>=0.30.1,<1",
    "beautifulsoup4>=4.14.3,<5",
    "huggingface-hub>=1.5.0,<2",
    "langchain>=1.3.9,<2",
    "langchain-community>=0.4.1,<1",
    "marshmallow>=3.26.2,<4", # dependency of langchain_community
    "langchain-text-splitters>=1.1.2,<2",
    "langsmith>=0.8.18,<1",
    "markdown>=3.10.2,<4",
    "nltk>=3.10.3,<4",
    "olefile>=0.47,<1",
    "pandas>=2.2.2,<3",
    "pymupdf>=1.28.2,<2",
    "pymupdf4llm>=1.28.2,<2",
    "pymupdf-layout>=1.28.2,<2",
    "python-bidi>=0.4.2,<1",
    "python-docx>=1.2.0,<2",
    "python-pptx>=1.0.2,<2",
    "pytesseract>=0.3.13,<1",
    "regex>=2025.11.3",
    "sentence_transformers>=5.6.1,<6",
    "shortuuid>=1.0.13,<2",
    "unstructured[all-docs]>=0.24.0,<1",
    "en-core-web-sm", # spaCy model unstructured/nlp/tokenize.py pins; else installed at runtime
    "pdfminer-six>=20260107", # dependency of all-docs
    "pypdf>=6.19.0,<7", # dependency of unstructured/all-docs; security update
    "pyasn1>=0.6.4,<1", # dependency of unstructured
    "cairosvg>=2.9.1,<3",
    "python-magic>=0.4.27,<1",
    "python-multipart>=0.0.32,<1", # required by FastAPI Form/UploadFile; no longer pulled in by unstructured
    "pathvalidate>=3.2.2,<4",
    "pillow>=13.0.0,<14",
    "langchain-experimental>=0.4.1,<1",
    "langchain-huggingface>=1.2.2,<2",
    "jinja2>=3.1.6,<4",
    "python-dotenv>=1.2.2,<2",
    "torch>=2.13.0,<3",
    "torchvision>=0.28.0,<0.29.0",
    "h11>=0.16.0,<1",
    "transformers>=5.10.0,<6",
    "markitdown>=0.1.6,<1",
    "setuptools>=80.10.2,<81",     # security update
    "requests>=2.34.2,<3",
    "urllib3>=2.8.0,<3",
    "opencv-python>=4.13.0.90,<5",
    "aiohttp>=3.14.3,<4",
    "docling>=2.132.0,<3",
    "tabulate>=0.9.0,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.3.0,<2",
    "pytest-cov>=5.0.0,<6",
    "fastapi>=0.136.3,<1",
    "docarray[proto,image]>=0.40.0,<1",
    "opentelemetry-api>=1.39.1,<2",
    "opentelemetry-exporter-otlp>=1.39.1,<2",
    "opentelemetry-sdk>=1.39.1,<2",
    "setuptools>=80.10.2,<81",
]

[dependency-groups]
security-overrides = [
  "protobuf>=6.33.5,<7",
  "cryptography>=50.0.0,<51",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "torchvision-cpu" },
]
# Keep in step with the wheel unstructured/nlp/tokenize.py pins.
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "torchvision-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
