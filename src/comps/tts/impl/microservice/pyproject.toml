[project]
name = "Intel-Enterprise-RAG-TTS_Microservice"
version = "3.0.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "aiohttp>=3.14.3,<4",
    "docarray[proto,image]>=0.40.0,<1",
    "fastapi>=0.136.3,<1",
    "opentelemetry-api>=1.39.1,<2",
    "opentelemetry-exporter-otlp>=1.39.1,<2",
    "prometheus-fastapi-instrumentator>=8.0.0,<9",
    "uvicorn>=0.30.1,<1",
    "shortuuid>=1.0.13,<2",
    "python-dotenv>=1.2.2,<2",
    "langchain-text-splitters>=1.1.2,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.3.0,<2",
    "pytest-cov>=5.0.0,<6",
    "fastapi>=0.136.3,<1",
    "docarray[proto,image]>=0.40.0,<1",
    "opentelemetry-api>=1.39.1,<2",
    "opentelemetry-exporter-otlp>=1.39.1,<2",
    "opentelemetry-sdk>=1.39.1,<2",
]

[dependency-groups]
security-overrides = [
  "protobuf>=6.33.5,<7",
  "urllib3>=2.8.0,<3",
]
