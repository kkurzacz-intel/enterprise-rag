[project]
name = "Intel-Enterprise-RAG-EDP_Microservice"
version = "3.0.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "fastapi>=0.136.3,<1",
    "uvicorn>=0.30.1,<1",
    "python-dotenv>=1.2.2,<2",
    "SQLAlchemy>=2.0.36,<2.1",
    "minio>=7.2.12,<7.2.13",
    "psycopg2-binary>=2.9.10,<3",
    "PyJWT[crypto]>=2.14.0,<3",
    "celery>=5.5.3,<6",
    "redis>=5.2.1,<6",
    "flower>=2.0.1,<3",
    "validators>=0.34.0,<1",
    "requests>=2.33.1,<3",
    "httpx>=0.28.1,<1",
    "prometheus-client>=0.21.1,<1",
    "boto3>=1.36.26,<2",
    "starlette>=1.0.1,<2",
    "jinja2>=3.1.6,<4",
    "pyyaml>=6.0.2,<7",
    "h11>=0.16.0,<1",
    "tornado>=6.5.9,<7",
    "alembic>=1.16.4,<2",
    "urllib3>=2.8.0,<3",
    "python-multipart>=0.0.32,<1",
]

